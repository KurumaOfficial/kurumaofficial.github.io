<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aleph Studio — Вход</title>
<script>window.__ALEPH_LOCALE__ = 'ru';</script>
<script>(function(){try{var t=localStorage.getItem('aleph-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}}catch(e){}}());</script>
<link rel="icon" href="../../../favicon.ico" sizes="48x48">
<link rel="icon" href="../../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../../../assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Karla:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@200;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/main.css?v=12">
<link rel="stylesheet" href="../../../assets/css/auth.css?v=1">
</head>
<body>

<a id="skipLink" class="skip-link" href="#main">Перейти к основному содержимому</a>

<nav class="nav" aria-label="Основная навигация">
  <a id="logoLink" class="nav-logo" href="../../../ru/" aria-label="Aleph Studio — наверх">
      <span class="nav-logo__sq" aria-hidden="true"></span>
      <span class="logo-text">Aleph Studio</span>
  </a>

  <div class="nav-links">
    <a id="navLinkProducts" class="nav__link" href="../../../ru/products/">Продукты</a>
    <a id="navLinkDonate" class="nav__link" href="../../../ru/donate/" data-donate-link>Поддержать</a>
  </div>

  <div class="nav-right">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Переключить тему" aria-pressed="false">
      <span class="theme-icon" id="themeIco" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 2.8v2.6M12 18.6v2.6M4.8 12H2.2M21.8 12h-2.6M5.9 5.9l1.9 1.9M16.2 16.2l1.9 1.9M18.1 5.9l-1.9 1.9M7.8 16.2l-1.9 1.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></span>
    </button>

    <div id="localeSwitcher" class="locale-switcher">
      <button
        id="localeSwitcherTrigger"
        class="locale-switcher__trigger"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-label="Переключатель языков"
      >
        <span id="localeSwitcherFlag" class="locale-switcher__flag" aria-hidden="true"></span>
        <span id="localeSwitcherLabel">RU</span>
        <svg class="locale-switcher__caret" viewBox="0 0 12 12" aria-hidden="true">
          <polyline points="2,4 6,8 10,4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
        </svg>
      </button>
      <div
        id="localeSwitcherMenu"
        class="locale-switcher__menu"
        role="menu"
        aria-label="Выбор языка"
        hidden
      ></div>
    </div>
  </div>
</nav>

<main id="main" class="reveal">

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Вход в <em>Aleph</em></h1>
      <p class="auth-subtitle">Войдите в личный кабинет для доступа к вашим лицензиям</p>
    </div>
    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Эл. почта / Логин</label>
        <input class="form-input" type="text" id="email" required placeholder="name@example.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Пароль</label>
        <input class="form-input" type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember">
          Запомнить меня
        </label>
        <a class="forgot-link" href="../reset/">Забыли пароль?</a>
      </div>
      <button class="auth-btn" type="submit">Войти</button>
    </form>
    <div class="auth-divider">или через</div>
    <div class="social-auth">
      <button class="social-btn">
        <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.45-5c.88-.65,1.74-1.34,2.58-2a75.58,75.58,0,0,0,72.68,0c.84.71,1.7,1.4,2.58,2a68.43,68.43,0,0,1-10.45,5,77.7,77.7,0,0,0,6.63,10.85,105.73,105.73,0,0,0,31-18.83C129.24,48.54,122.61,25.76,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/></svg>
        Войти через Discord
      </button>
    </div>
    <div class="auth-footer">
      Нет аккаунта? <a class="auth-link" href="../register/">Создать аккаунт</a>
    </div>
  </div>
</div>

</main>

<footer class="site-footer">
    <div class="site-footer__main">
        <div class="site-footer__left">
            <a class="site-footer__logo" href="../../../ru/">
                <span class="site-footer__sq" aria-hidden="true"></span>
                <span class="site-footer__name">Aleph Studio</span>
            </a>
            <span class="site-footer__divider" aria-hidden="true"></span>
            <span id="footerTagline" class="site-footer__tagline">Дочерний проект WeTTeA</span>
        </div>
        <nav id="footerNav" class="site-footer__nav" aria-label="Подвал — навигация">
            <a href="../../../ru/products/">Продукты</a>
            <a href="../../../ru/#manifesto">Принцип</a>
            <a href="../../../ru/#team">Команда</a>
            <span class="site-footer__nav-sep" aria-hidden="true"></span>
            <a id="footerDonateLink" href="../../../ru/donate/">Поддержать</a>
        </nav>
        <div id="footerSocialLinks" class="site-footer__socials" aria-label="Социальные сети"></div>
    </div>
    <div class="site-footer__bottom">
        <span id="footerCopyright" class="site-footer__copy">© 2026. Все права защищены.</span>
    </div>
</footer>

<script type="module" src="../../../src/auth/login.js?v=1"></script>
</body>
</html>
