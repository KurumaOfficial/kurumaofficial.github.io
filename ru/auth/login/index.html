<!doctype html>
<html lang="ru" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aleph Studio — Вход</title>
<meta name="theme-color" content="#080606">
<meta name="color-scheme" content="dark light">
<script>window.__ALEPH_LOCALE__ = 'ru';</script>
<script>(function(){try{var t=localStorage.getItem('aleph-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}}catch(e){}}());</script>
<link rel="icon" href="../../../favicon.ico" sizes="48x48">
<link rel="icon" href="../../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../../../assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@200;400;700&display=swap">
<link rel="stylesheet" href="../../../assets/css/main.css?v=13">
<link rel="stylesheet" href="../../../assets/css/auth.css?v=4">
</head>
<body>
<a id="skipLink" class="skip-link" href="#main">Skip to content</a>
<nav class="nav" aria-label="Main navigation">
    <a id="logoLink" class="nav-logo" href="../../../ru/" aria-label="Aleph Studio">
        <span class="logo-sq" aria-hidden="true"></span>
        <span class="logo-text">Aleph Studio</span>
    </a>
    <div class="nav-links">
        <a id="navLinkProducts" class="nav__link" href="../../products/">Продукты</a>
        <a id="navLinkDonate" class="nav__link" href="../../donate/" data-donate-link>Поддержать</a>
          <a id="navLinkDocs" class="nav__link" href="../../docs/">Документация</a>
    </div>
    <div class="nav-right">
        <div id="localeSwitcher" class="locale-switcher">
            <button id="localeSwitcherTrigger" class="locale-switcher__trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Выбор языка">
                <span id="localeSwitcherFlag" class="locale-switcher__flag" aria-hidden="true"></span>
                <span id="localeSwitcherLabel">RU</span>
                <svg class="locale-switcher__caret" viewBox="0 0 12 12" aria-hidden="true"><polyline points="2,4 6,8 10,4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="localeSwitcherMenu" class="locale-switcher__menu" role="menu" aria-label="Выбор языка" hidden></div>
        </div>
        <a id="navAuthBtn" class="nav-auth-btn" href="../../auth/login/">Войти</a>
        </div>
</nav>
<main id="main">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Вход в <em>Wet</em>ID</h1>
      <p class="auth-subtitle">Доступ к лицензиям и личному кабинету</p>
    </div>
    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Эл. почта / Логин</label>
        <input class="form-input" type="text" id="email" required placeholder="name@example.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Пароль</label>
        <input class="form-input" type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="form-options">
        <label class="remember-me"><input type="checkbox" id="remember"> Запомнить меня</label>
        <a class="forgot-link" href="../reset/">Забыли пароль?</a>
      </div>
      <button class="auth-btn" type="submit">Войти</button>
    </form>
    <div class="auth-footer">Нет аккаунта? <a class="auth-link" href="../register/">Создать аккаунт</a></div>
  </div>
</div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" aria-hidden="true"></div>
<script type="module" src="../../../src/auth/login.js?v=2"></script>
</body>
</html>
