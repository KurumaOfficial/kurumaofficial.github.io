<!doctype html>
<html lang="ua" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aleph Studio — Реєстрація</title>
<meta name="theme-color" content="#080606">
<meta name="color-scheme" content="dark light">
<script>window.__ALEPH_LOCALE__ = 'ua';</script>
<script>(function(){try{var t=localStorage.getItem('aleph-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}}catch(e){}}());</script>
<link rel="icon" href="../../../favicon.ico" sizes="48x48">
<link rel="icon" href="../../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../../../assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@200;400;700&display=swap">
<link rel="stylesheet" href="../../../assets/css/main.css?v=13">
<link rel="stylesheet" href="../../../assets/css/auth.css?v=4">
</head>
<body>
<a id="skipLink" class="skip-link" href="#main">Skip to content</a>
<nav class="nav" aria-label="Main navigation">
    <a id="logoLink" class="nav-logo" href="../../../ua/" aria-label="Aleph Studio">
        <span class="logo-sq" aria-hidden="true"></span>
        <span class="logo-text">Aleph Studio</span>
    </a>
    <div class="nav-links">
        <a id="navLinkProducts" class="nav__link" href="../../../ua/products/">Продукти</a>
        <a id="navLinkDonate" class="nav__link" href="../../../ua/donate/" data-donate-link>Підтримати</a>
    </div>
    <div class="nav-right">
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme" aria-pressed="false">
            <span class="theme-icon" id="themeIco" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.6M12 18.6v2.6M4.8 12H2.2M21.8 12h-2.6M5.9 5.9l1.9 1.9M16.2 16.2l1.9 1.9M18.1 5.9l-1.9 1.9M7.8 16.2l-1.9 1.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        </button>
        <div id="localeSwitcher" class="locale-switcher">
            <button id="localeSwitcherTrigger" class="locale-switcher__trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Мова">
                <span id="localeSwitcherFlag" class="locale-switcher__flag" aria-hidden="true"></span>
                <span id="localeSwitcherLabel">UA</span>
                <svg class="locale-switcher__caret" viewBox="0 0 12 12" aria-hidden="true"><polyline points="2,4 6,8 10,4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="localeSwitcherMenu" class="locale-switcher__menu" role="menu" aria-label="Мова" hidden></div>
        </div>
    </div>
</nav>
<main id="main">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Реєстрація</h1>
      <p class="auth-subtitle">Створіть акаунт в системі WetID</p>
    </div>
    <form class="auth-form" id="registerForm">
      <div class="form-group">
        <label class="form-label" for="username">Ім'я користувача</label>
        <input class="form-input" type="text" id="username" required placeholder="User" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Ел. пошта</label>
        <input class="form-input" type="email" id="email" required placeholder="name@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Пароль</label>
        <input class="form-input" type="password" id="password" required placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Підтвердіть пароль</label>
        <input class="form-input" type="password" id="confirmPassword" required placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="agree" required>
          <span>Я погоджуюся з <a class="auth-link" href="../../docs/terms/" target="_blank">Правилами</a> та <a class="auth-link" href="../../docs/privacy/" target="_blank">Політикою конфіденційності</a></span>
        </label>
      </div>
      <button class="auth-btn" type="submit">Створити акаунт</button>
    </form>
    <div class="auth-footer">Вже є акаунт? <a class="auth-link" href="../login/">Увійти</a></div>
  </div>
</div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" aria-hidden="true"></div>
<script type="module" src="../../../src/auth/register.js?v=2"></script>
</body>
</html>
